<!DOCTYPE html>
<html lang="en">
<head>
    <title>loop for Of</title>
</head>
<body>
    <script>
        let miArray = [5, 9, 6, 4, 8];
        let suma = 0;
        function testLoop (){
            for(let numeros of miArray) {
                suma += numeros;
            }
            console.log(suma)
        }
    </script>
</body>
</html>
