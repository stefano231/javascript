<!DOCTYPE html>
<html lang="en">
<head>
    <title>while 1</title>
</head>
<body>
    <script>
        let numero = 0; 

        while (numero <= 0){ 
            numero = parseInt(prompt("Introduce un número:"));
        }

        document.write("<h1>"+ "Vueltas " + numero + "</h1>"); 
    </script>
</body>
</html>
